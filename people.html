<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>参加者の声｜ふらっともるっく</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: #f6f6f6;
      color: #333;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
      color: #2c7a7b;
    }

    .voices {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .voice-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.05);
    }

    .voice-comment {
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .voice-name {
      font-weight: bold;
      color: #2c7a7b;
    }

    .voice-info {
      font-size: 0.9rem;
      color: #666;
    }

    footer {
      margin-top: 60px;
      text-align: center;
      font-size: 0.9rem;
      color: #666;
    }

    footer a {
      margin: 0 10px;
      color: #2c7a7b;
      font-weight: bold;
      text-decoration: none;
    }
/* こんな人におすすめ */
.recommend {
  margin-top: 60px;
  background: #f1f9f8;
  padding: 35px 25px;
  border-radius: 16px;
}

.recommend h2 {
  color: #2c7a7b;
  margin-bottom: 20px;
  border-left: 6px solid #2c7a7b;
  padding-left: 12px;
}

.recommend-list {
  list-style: none;
  padding: 0;
  margin: 0;
}

.recommend-list li {
  background: #ffffff;
  margin-bottom: 12px;
  padding: 14px 18px;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  position: relative;
  padding-left: 36px;
}

.recommend-list li::before {
  content: "✓";
  position: absolute;
  left: 14px;
  top: 14px;
  color: #2c7a7b;
  font-weight: bold;
}
   /* ===== フッター ===== */
    footer {
      background: #ffffff;
      padding: 20px;
      text-align: center;
      border-top: 1px solid #eee;
    }

    footer a {
      margin: 0 10px;
      font-weight: bold;
      color: #2c7a7b;
    }
.insta-btn {
  padding: 8px 16px;
  border: 2px solid #E1306C;
  border-radius: 20px;
  color: #E1306C;
  font-weight: bold;
  margin-right: 10px;
}

.insta-btn:hover {
  background: #E1306C;
  color: #fff;
}

  </style>
</head>

<body>
  <div class="container">

    <h1>参加者の声</h1>

    <div class="voices">

      <!-- 声① -->
      <div class="voice-card">
        <div class="voice-comment">
          モルックは初めてでしたが、ルールはシンプルで簡単に始められました。意外に奥が深くて少しやっただけで面白いな！ってなりました。
        </div>
        <div class="voice-name">Yさん</div>
        <div class="voice-info">大学1年生・未経験</div>
      </div>

 
    </div>
<section class="recommend">
  <h2>こんな人におすすめ</h2>

  <ul class="recommend-list">
    <li>大学の枠を超えて友達を作りたい人</li>
    <li>新しいスポーツを気軽に始めてみたい人</li>
    <li>ガチすぎない、ゆるいサークルを探している人</li>
    <li>外で体を動かすのが好きな人</li>
    <li>都合の合うときにふらっと参加したい人</li>
  </ul>
</section>
  
  </div>
