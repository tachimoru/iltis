<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ギャラリー｜ふらっともるっく</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: #f7f7f7;
      color: #333;
    }

    .wrapper {
      display: flex;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 左の目次 */
    .sidebar {
      width: 220px;
      background: #ffffff;
      padding: 20px;
      position: sticky;
      top: 0;
      height: 100vh;
      border-right: 1px solid #eee;
    }

    .sidebar h2 {
      font-size: 1.1rem;
      margin-bottom: 15px;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
    }

    .sidebar li {
      margin-bottom: 10px;
    }

    .sidebar a {
      text-decoration: none;
      color: #2c7a7b;
      font-weight: bold;
    }

    .sidebar a:hover {
      text-decoration: underline;
    }

    /* 右のコンテンツ */
    .content {
      flex: 1;
      padding: 30px;
    }

    .section {
      margin-bottom: 50px;
    }

    .section h3 {
      font-size: 1.4rem;
      margin-bottom: 15px;
      border-left: 5px solid #2c7a7b;
      padding-left: 10px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    .gallery img {
      width: 100%;
      border-radius: 8px;
      object-fit: cover;
    }

    footer {
      text-align: center;
      margin-top: 60px;
      font-size: 0.9rem;
      color: #666;
    }

    /* スマホ対応 */
    @media (max-width: 768px) {
      .wrapper {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        border-right: none;
        border-bottom: 1px solid #eee;
      }
    }
  /* ===== フッター ===== */
    footer {
      background: #ffffff;
      padding: 20px;
      text-align: center;
      border-top: 1px solid #eee;
    }

    footer a {
      margin: 0 10px;
      font-weight: bold;
      color: #2c7a7b;
    }
.insta-btn {
  padding: 8px 16px;
  border: 2px solid #E1306C;
  border-radius: 20px;
  color: #E1306C;
  font-weight: bold;
  margin-right: 10px;
}

.insta-btn:hover {
  background: #E1306C;
  color: #fff;
}

  </style>
</head>

<body>
  <div class="wrapper">

    <!-- 左メニュー -->
    <nav class="sidebar">
      <h2>目次</h2>
      <ul>
        <li><a href="#practice">活動風景</a></li>
        <li><a href="#event">イベント</a></li>
        <li><a href="#tournament">大会</a></li>
        <li><a href="#casual">オフショット</a></li>
      </ul>
    </nav>

    <!-- 右コンテンツ -->
    <main class="content">
      <h1>ギャラリー</h1>

      <section id="practice" class="section">
        <h3>活動風景</h3>
        <div class="gallery">
          <img src="S__72253446.jpg" alt="活動写真">
          <img src="images/practice2.jpg" alt="活動写真">
          <img src="images/practice3.jpg" alt="活動写真">
        </div>
      </section>

      <section id="event" class="section">
        <h3>イベント</h3>
        <div class="gallery">
          <img src="images/event1.jpg" alt="イベント写真">
          <img src="images/event2.jpg" alt="イベント写真">
          <img src="images/event3.jpg" alt="イベント写真">
        </div>
      </section>

      <section id="tournament" class="section">
        <h3>大会</h3>
        <div class="gallery">
          <img src="images/tournament1.jpg" alt="大会写真">
          <img src="images/tournament2.jpg" alt="大会写真">
        </div>
      </section>

      <section id="casual" class="section">
        <h3>オフショット</h3>
        <div class="gallery">
          <img src="images/casual1.jpg" alt="オフショット">
          <img src="images/casual2.jpg" alt="オフショット">
        </div>
      </section>

   <!-- フッター -->
  <footer>
    <a href="index.html">ホーム</a>｜
    <a href="activity.html">活動報告</a>｜
    <a href="https://forms.gle/azZCckd4B6eGhaPK9">団体参加</a>


  </footer>

    </main>

  </div>
</body>
</html>
